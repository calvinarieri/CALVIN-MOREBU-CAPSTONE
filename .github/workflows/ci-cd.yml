name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_FRONTEND: calvin-arieri/frontend
  ECR_REPOSITORY_BACKEND: calvin-arieri/backend
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: calvin-arieri

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Frontend Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_BASE_URL="${{ secrets.VITE_BASE_URL }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            frontend


      - name: Push Frontend Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG


      - name: Build Backend Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            backend


      - name: Push Backend Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG


      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name ${{ secrets.EKS_CLUSTER_NAME }}


      - name: Create Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml


      - name: Create ECR Pull Secret
        run: |
          kubectl create secret docker-registry ecr-secret \
            --namespace $NAMESPACE \
            --docker-server=$ECR_REGISTRY \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region $AWS_REGION) \
            --dry-run=client -o yaml | kubectl apply -f -


      - name: Create Database Secret
        run: |
          kubectl create secret generic database-secret \
            --namespace $NAMESPACE \
            --from-literal=DB_ENGINE="mysql" \
            --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=DB_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=POSTGRES_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=POSTGRES_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=POSTGRES_DB="${{ secrets.DB_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -


      - name: Create Django Secret
        run: |
          kubectl create secret generic django-secret \
            --namespace $NAMESPACE \
            --from-literal=SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
            --from-literal=DEBUG="False" \
            --from-literal=ALLOWED_HOSTS="*" \
            --dry-run=client -o yaml | kubectl apply -f -


      - name: Deploy Redis
        run: |
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-service.yaml


      - name: Update Kubernetes Image References
        env:
          FRONTEND_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}
          BACKEND_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          echo "Frontend image: $FRONTEND_IMAGE"
          echo "Backend image: $BACKEND_IMAGE"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          frontend_image = os.environ["FRONTEND_IMAGE"]
          backend_image = os.environ["BACKEND_IMAGE"]
          pattern = re.compile(r"^[a-z0-9]+(?:[._-][a-z0-9]+)*(?::[0-9]+)?(?:/[a-z0-9._/-]+)+(?::[a-zA-Z0-9._-]+)?$")

          for image, path in [(frontend_image, "k8s/deployment-frontend.yaml"), (backend_image, "k8s/deployment-backend.yaml")]:
              if not image or not pattern.match(image):
                  raise SystemExit(f"Invalid image reference: {image}")
              text = Path(path).read_text()
              if path.endswith("deployment-frontend.yaml"):
                  text = text.replace("IMAGE_FRONTEND", image)
              else:
                  text = text.replace("IMAGE_BACKEND", image)
              Path(path).write_text(text)
          PY


      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/deployment-frontend.yaml
          kubectl apply -f k8s/service-frontend.yaml


      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/deployment-backend.yaml
          kubectl apply -f k8s/service-backend.yaml


      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml


      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n $NAMESPACE \
            --timeout=300s


      - name: Run Django Migrations
        run: |
          POD=$(kubectl get pods \
            -n $NAMESPACE \
            -l app=backend \
            -o jsonpath="{.items[0].metadata.name}")

          kubectl exec \
            -n $NAMESPACE \
            $POD \
            -- python manage.py migrate


      - name: Collect Static Files
        run: |
          POD=$(kubectl get pods \
            -n $NAMESPACE \
            -l app=backend \
            -o jsonpath="{.items[0].metadata.name}")

          kubectl exec \
            -n $NAMESPACE \
            $POD \
            -- python manage.py collectstatic --noinput


      - name: Verify Deployments
        run: |
          kubectl rollout status deployment/frontend \
            -n $NAMESPACE \
            --timeout=300s

          kubectl rollout status deployment/backend \
            -n $NAMESPACE \
            --timeout=300s

          kubectl get ingress -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
          kubectl get pods -n $NAMESPACE
          kubectl get deploy -n $NAMESPACE