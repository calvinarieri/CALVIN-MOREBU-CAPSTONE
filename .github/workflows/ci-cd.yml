name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_FRONTEND: calvin-arieri/frontend
  ECR_REPOSITORY_BACKEND: calvin-arieri/backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            frontend

      - name: Push Frontend Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG

      - name: Build Backend Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            backend

      - name: Push Backend Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create ECR Pull Secret
        run: |
          kubectl create secret docker-registry ecr-secret \
            --namespace calvin-arieri \
            --docker-server=$ECR_REGISTRY \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region $AWS_REGION) \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Database Secret
        run: |
          kubectl create secret generic database-secret \
            --namespace calvin-arieri \
            --from-literal=POSTGRES_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=POSTGRES_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=POSTGRES_DB="${{ secrets.DB_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Django Secret
        run: |
          kubectl create secret generic django-secret \
            --namespace calvin-arieri \
            --from-literal=SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
            --from-literal=DEBUG="${{ secrets.DJANGO_DEBUG }}" \
            --from-literal=ALLOWED_HOSTS="${{ secrets.DJANGO_ALLOWED_HOSTS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Redis
        run: |
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-service.yaml

      - name: Update Kubernetes Images
        run: |
          sed -i "s|IMAGE_FRONTEND|$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG|g" k8s/deployment-frontend.yaml
          sed -i "s|IMAGE_BACKEND|$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG|g" k8s/deployment-backend.yaml

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment-frontend.yaml
          kubectl apply -f k8s/service-frontend.yaml

          kubectl apply -f k8s/deployment-backend.yaml
          kubectl apply -f k8s/service-backend.yaml

          kubectl apply -f k8s/ingress.yaml

      - name: Wait for Backend Deployment
        run: |
          kubectl rollout status deployment/backend \
            -n calvin-arieri \
            --timeout=300s

      - name: Run Django Migrations
        run: |
          kubectl exec \
            -n calvin-arieri \
            deploy/backend \
            -- python manage.py migrate

      - name: Collect Static Files
        run: |
          kubectl exec \
            -n calvin-arieri \
            deploy/backend \
            -- python manage.py collectstatic --noinput

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/frontend \
            -n calvin-arieri \
            --timeout=300s

          kubectl rollout status deployment/backend \
            -n calvin-arieri \
            --timeout=300s

          kubectl rollout status deployment/redis \
            -n calvin-arieri \
            --timeout=300s