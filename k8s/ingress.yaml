apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend-ingress
  namespace: calvin-arieri

  annotations:
    kubernetes.io/ingress.class: nginx

spec:

  rules:
    - host: calvin-arieri.capstone.company.com

      http:

        paths:

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: backend
                port:
                  number: 8000


          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: 80