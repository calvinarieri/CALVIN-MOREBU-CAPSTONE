pid /tmp/nginx.pid;

events {}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;


    server {

        listen 80;

        server_name _;


        root /usr/share/nginx/html;

        index index.html;


        location / {

            try_files $uri $uri/ /index.html;

        }


        location /health {

            access_log off;

            return 200 "healthy\n";

            add_header Content-Type text/plain;

        }

    }

}